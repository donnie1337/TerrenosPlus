  too-small: "&cO terreno precisa ter pelo menos &f{min}x{min}&c blocos."
  too-large: "&cEsse terreno é grande demais. Limite: &f{max}&c blocos."
  overlap: "&cEsse terreno se sobrepõe ao terreno de &f{owner}&c."
  claim-limit: "&cVocê já atingiu o limite de &f{max}&c terrenos."
  created: "&aTerreno criado com &f{area}&a blocos."
