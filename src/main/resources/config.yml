claims:
  # Apenas nestes mundos jogadores podem criar terrenos.
  enabled-worlds:
    - world
    - world_nether
    - world_the_end
    - mining

  # Todo terreno novo começa em exatamente 10x10.
  minimum-width: 10
  minimum-area: 100
  initial-maximum-width: 10
  maximum-area-per-claim: 10000

  expansion:
    # Cada novo bloco de área custa esta quantidade de Marcos.
    # O comando /terreno expandir <marcos> <direção> usa <marcos> como orçamento.
    marcos-per-block: 1

  # Limite de terrenos por cargo do CargoPlus.
  # Membro pode ter 3; qualquer outro cargo pode ter 5.
  limits:
    membro: 3
    default: 5

  # Terrenos de jogadores que ficarem offline por este período perdem a proteção.
  expiration:
    enabled: true
    offline-days: 90
    check-interval-hours: 24

    # Ao expirar, uma pequena quantidade de folhas persistentes é colocada
    # somente em espaços de ar próximos à construção. Nenhum bloco existente
    # é substituído. O efeito também é aplicado no Nether, End e Mineração.
    abandoned-foliage:
      enabled: true
      material: OAK_LEAVES
      max-leaves: 18

marcos:
  hourly:
    minutes: 60
    rewards: [25, 50, 75]
    title: "&e&l+{amount} Marcos"
    subtitle: "&fRecompensa por &e1 hora &fonline"
  daily:
    # Sequência de 7 dias. Se o jogador perder um dia, volta ao Dia 1.
    rewards: [5, 5, 10, 10, 15, 20, 25]

tool:
  material: GOLDEN_SHOVEL

protection:
  block-break: true
  block-place: true
  interactions: true
  buckets: true
  explosions: true
  pistons: true
  fluids: true

