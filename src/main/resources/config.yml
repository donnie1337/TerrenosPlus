claims:
  # Apenas nestes mundos jogadores podem criar terrenos.
  enabled-worlds:
    - world

  minimum-width: 5
  minimum-area: 25
  maximum-area-per-claim: 10000

  # Limite de terrenos por cargo do CargoPlus.
  # Membro pode ter 3; qualquer outro cargo pode ter 5.
  limits:
    membro: 3
    default: 5

tool:
  material: GOLDEN_SHOVEL

protection:
  block-break: true
  block-place: true
  interactions: true
  buckets: true
  explosions: true
  pistons: true
  fluids: true

messages:
  prefix: "&a[Terrenos] &r"
  disabled-world: "&cNão é possível criar terrenos neste mundo."
  first-corner: "&aPrimeiro canto selecionado em &f{x}, {z}&a. Clique no canto oposto."
